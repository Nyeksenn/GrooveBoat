import org.apache.tools.ant.taskdefs.condition.Os

plugins {
    id 'application'
    id 'io.ebean' version '19.6.0'
    id 'io.github.jwharm.flatpak-gradle-generator' version '1.8.0'
    id 'com.gradleup.shadow' version '9.6.1'
}

repositories {
    maven { url = 'build/repository' } // used by flatpak-builder
    mavenCentral()
}

def appId = 'io.github.Nyeksenn.grooveboat'

ext {
    ebeanVersion = "19.6.0"
    javaGiVersion = "1.0.0-RC3"
}

dependencies {
    implementation "org.java-gi:gstreamer:${javaGiVersion}"
    implementation "org.java-gi:glib:${javaGiVersion}"
    implementation "org.java-gi:gtk:${javaGiVersion}"
    implementation "org.java-gi:adw:${javaGiVersion}"
    implementation "org.java-gi:secret:${javaGiVersion}"
    implementation 'tools.jackson.core:jackson-databind:3.2.4'
    implementation 'tools.jackson.module:jackson-module-blackbird:3.2.4'
    implementation "io.ebean:ebean:${ebeanVersion}"
    implementation "io.ebean:ebean-ddl-generator:${ebeanVersion}"
    implementation "io.ebean:ebean-platform-h2:${ebeanVersion}"
    implementation 'com.h2database:h2:2.5.252'
    implementation 'com.github.hypfvieh:dbus-java-core:5.2.2'
    implementation 'com.github.hypfvieh:dbus-java-transport-native-unixsocket:5.2.2'
    implementation 'commons-validator:commons-validator:1.11.0'
    implementation 'org.semver4j:semver4j:6.0.0'

    testImplementation "io.ebean:ebean-test:${ebeanVersion}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testImplementation 'org.assertj:assertj-core:3.27.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.4'

    annotationProcessor "io.ebean:querybean-generator:${ebeanVersion}"
    runtimeOnly 'org.slf4j:slf4j-api:2.0.20'
    runtimeOnly 'ch.qos.logback:logback-classic:1.6.6'
}

// No toolchain: the flatpak build uses whatever JDK the SDK extension provides (25 or newer).
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.compilerArgs += ['-Xlint:all,-processing,-this-escape', '-Werror']
}

// Generate a file with all dependency urls for the offline flatpak build
tasks.flatpakGradleGenerator {
    outputFile.set(file("$rootDir/data/maven-dependencies.json"))
    downloadDirectory.set('build/repository')
    // The ebean plugin resolves the test classpath during compileJava, so test dependencies are needed too
}

tasks.named('shadowJar') {
    archiveFileName = 'grooveboat.jar'
    // Service files must reach the merge transformer, but Shadow drops duplicates before that unless they are
    // included. Other duplicates (license files) stay excluded, or the jar gets duplicate entries.
    filesMatching('META-INF/services/**') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
    mergeServiceFiles()
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    // LibrarySync reads GSettings: use the schema compiled for development runs, with a throwaway backend
    dependsOn 'compileSchemas'
    environment 'GSETTINGS_BACKEND', 'memory'
    environment 'GSETTINGS_SCHEMA_DIR', layout.buildDirectory.dir('schemas').get().asFile.absolutePath
    failOnNoDiscoveredTests = false
}

tasks.register('generateMigrations', JavaExec) {
    group = 'migration'
    description = 'Generate database migrations'

    dependsOn compileTestJava
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.Nyeksenn.grooveboat.MigrationGenerator'
}


// Development only: the generated data/css/main.css is committed, so the flatpak build doesn't need sass.
tasks.register('compileSass', Exec) {
    description = 'Compile SASS files to CSS'
    group = 'build'

    inputs.dir('data/scss')
    outputs.file('data/css/main.css')
    workingDir = file('data/scss')
    commandLine 'sass', '--no-source-map', 'main.scss:../css/main.css'
}

// Development only: the flatpak build compiles the gresource bundle with Meson.
tasks.register('compileResources', Exec) {
    description = 'Compile the gresource bundle for development runs'
    group = 'build'
    dependsOn compileSass

    inputs.dir('data')
    outputs.file("build/generated/${appId}.gresource")
    doFirst { file('build/generated').mkdirs() }
    commandLine 'glib-compile-resources',
            '--sourcedir=data',
            "--target=build/generated/${appId}.gresource",
            "data/${appId}.gresource.xml"
}

// Compiles the GSettings schema into the build dir so `run` works without installing it system-wide.
tasks.register('copySchemas', Copy) {
    from "data/${appId}.gschema.xml"
    into layout.buildDirectory.dir('schemas')
}

tasks.register('compileSchemas', Exec) {
    description = 'Compile the GSettings schema for development runs'
    group = 'build'
    dependsOn copySchemas

    def schemaDir = layout.buildDirectory.dir('schemas')
    inputs.file("data/${appId}.gschema.xml")
    outputs.dir(schemaDir)
    commandLine 'glib-compile-schemas', schemaDir.get().asFile.absolutePath
}

tasks.named('run') {
    dependsOn compileResources, compileSchemas
    // The "devel" profile loads the gresource from build/generated and skips gettext
    environment 'PROFILE', 'devel'
    environment 'GSETTINGS_SCHEMA_DIR', layout.buildDirectory.dir('schemas').get().asFile.absolutePath
}

application {
    applicationName = 'grooveboat'
    mainClass = 'io.github.Nyeksenn.grooveboat.Main'

    // Allow native access
    applicationDefaultJvmArgs += '--enable-native-access=ALL-UNNAMED'

    // Add common library directories to the library lookup path
    if (Os.isFamily(Os.FAMILY_MAC))
        applicationDefaultJvmArgs += ['-Djavagi.path=/opt/homebrew/lib', '-XstartOnFirstThread']
    else if (Os.isFamily(Os.FAMILY_WINDOWS))
        applicationDefaultJvmArgs += ['-Djavagi.path=C:/msys64/mingw64/bin']
    else
        applicationDefaultJvmArgs += ['-Djavagi.path=/usr/lib/x86_64-linux-gnu:/lib64:/usr/lib64:/lib:/usr/lib']
}
