plugins {
    id 'application'
    id("io.ebean") version "17.1.1"
}

repositories {
    mavenCentral()
}

ext {
    ebeanVersion = "17.5.0"
    javaGiVersion = "0.14.1"
}

dependencies {
    implementation "org.java-gi:gstreamer:${javaGiVersion}"
    implementation "org.java-gi:glib:${javaGiVersion}"
    implementation "org.java-gi:gtk:${javaGiVersion}"
    implementation "org.java-gi:adw:${javaGiVersion}"
    implementation "org.java-gi:secret:${javaGiVersion}"
    implementation 'tools.jackson.core:jackson-databind:3.0.1'
    implementation 'tools.jackson.module:jackson-module-blackbird:3.0.1'
    implementation "io.ebean:ebean:${ebeanVersion}"
    implementation "io.ebean:ebean-ddl-generator:${ebeanVersion}"
    implementation "io.ebean:ebean-test:${ebeanVersion}"
    implementation 'com.h2database:h2:2.4.240'
    implementation 'commons-validator:commons-validator:1.10.0'
    implementation 'org.semver4j:semver4j:6.0.0'

    annotationProcessor "io.ebean:querybean-generator:${ebeanVersion}"
    runtimeOnly 'org.slf4j:slf4j-api:2.0.17'
    runtimeOnly 'ch.qos.logback:logback-classic:1.5.20'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jar {
    manifest {
        attributes 'Implementation-Title': 'GrooveBoat',
                'Implementation-Version': '1.0',
                'Main-Class': 'Main'
    }
}

abstract class CompileUiFiles extends DefaultTask {
    private ExecOperations execOperations

    @Inject
    CompileUiFiles(ExecOperations execOperations) {
        this.execOperations = execOperations
    }

    @TaskAction
    void doTaskAction() {
        execOperations.exec {
            setWorkingDir(project.file("src/main/resources"))
            commandLine 'glib-compile-resources', 'grooveboat.gresource.xml'
        }
    }
}

tasks.register('generateMigrations', JavaExec) {
    group = 'migration'
    description = 'Generate database migrations'

    dependsOn compileTestJava
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.Nyeksenn.grooveboat.MigrationGenerator'
}


tasks.register('compileSass', Exec) {
    description = 'Compile SASS files to CSS'
    group = 'build'

    workingDir = file('src/main/resources/scss')
    commandLine 'sass', '--no-source-map', 'main.scss:../css/main.css'
}

tasks.register('compileResources', CompileUiFiles) {
    dependsOn compileSass
}

tasks.named('classes') {
    dependsOn compileResources
}


// Compiles the GSettings schema into the build dir so `run` works without installing it system-wide
// (install_settings.sh is still needed for running the app any other way).
tasks.register('compileSchemas', Exec) {
    description = 'Compile the GSettings schema for development runs'
    group = 'build'

    def schemaDir = layout.buildDirectory.dir('schemas')
    inputs.file('src/main/resources/io.github.Nyeksenn.grooveboat.gschema.xml')
    outputs.dir(schemaDir)
    doFirst {
        def dir = schemaDir.get().asFile
        dir.mkdirs()
        project.copy {
            from 'src/main/resources/io.github.Nyeksenn.grooveboat.gschema.xml'
            into dir
        }
    }
    commandLine 'glib-compile-schemas', schemaDir.get().asFile.absolutePath
}

tasks.named('run') {
    dependsOn compileSchemas
    jvmArgs += "--enable-native-access=ALL-UNNAMED"
    environment 'GSETTINGS_SCHEMA_DIR', layout.buildDirectory.dir('schemas').get().asFile.absolutePath
}

application {
    mainClass = "io.github.Nyeksenn.grooveboat.Main"
}
