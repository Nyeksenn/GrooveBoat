plugins {
    id 'application'
    id("io.ebean") version "17.1.1"
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.java-gi:gstreamer:0.13.0-RC1'
    implementation 'org.java-gi:glib:0.13.0-RC1'
    implementation 'org.java-gi:gtk:0.13.0-RC1'
    implementation 'org.java-gi:adw:0.13.0-RC1'
    implementation 'org.java-gi:secret:0.13.0-RC1'
    implementation 'tools.jackson.core:jackson-databind:3.0.1'
    implementation 'tools.jackson.module:jackson-module-blackbird:3.0.1'
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.5.1'
    implementation 'io.ebean:ebean:17.1.1'
    implementation 'io.ebean:ebean-ddl-generator:17.1.1'
    implementation 'io.ebean:ebean-test:17.1.1'
    implementation 'com.h2database:h2:2.4.240'
    implementation 'commons-validator:commons-validator:1.10.0'

    annotationProcessor 'io.ebean:querybean-generator:17.1.1'
    runtimeOnly 'org.slf4j:slf4j-api:2.0.17'
    runtimeOnly 'ch.qos.logback:logback-classic:1.5.20'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(23)
    }
}

jar {
    manifest {
        attributes 'Implementation-Title': 'GrooveBoat',
                'Implementation-Version': '1.0',
                'Main-Class': 'Main'
    }
}

abstract class CompileUiFiles extends DefaultTask {
    private ExecOperations execOperations

    @Inject
    CompileUiFiles(ExecOperations execOperations) {
        this.execOperations = execOperations
    }

    @TaskAction
    void doTaskAction() {
        execOperations.exec {
            setWorkingDir(project.file("src/main/resources"))
            commandLine 'glib-compile-resources', 'grooveboat.gresource.xml'
        }
    }
}

tasks.register('generateMigrations', JavaExec) {
    group = 'migration'
    description = 'Generate database migrations'

    dependsOn compileTestJava
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.Nyeksenn.grooveboat.MigrationGenerator'
}


tasks.register('compileResources', CompileUiFiles) {}

tasks.named('classes') {
    dependsOn compileResources
}


tasks.named('run') {
    jvmArgs += "--enable-native-access=ALL-UNNAMED"
}

application {
    mainClass = "io.github.Nyeksenn.grooveboat.Main"
}
